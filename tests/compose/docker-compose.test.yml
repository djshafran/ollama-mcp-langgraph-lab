services:
  hydra_mock:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "/app/tests/fixtures/hydra_mock/app.py"]
    volumes:
      - ../../:/app
    expose:
      - "8080"

  l0:
    build:
      context: ../..
      dockerfile: src/l0/server/Dockerfile
    depends_on:
      - hydra_mock
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - L0_BACKEND=${L0_BACKEND:-simple}
      - SYNTAX_BACKEND=${SYNTAX_BACKEND:-hyderabad}
      - HYD_PARSER_URL=http://hydra_mock:8080/parse
      - L0_ARTIFACT_DIR=/artifacts/current
      - L0_DATA_DIR=/data
      - HERITAGE_METHOD=${HERITAGE_METHOD:-shell}
      - HERITAGE_BASE_DIR=${HERITAGE_BASE_DIR:-/opt/Heritage_Platform}
      - HERITAGE_REQUEST_TIMEOUT=${HERITAGE_REQUEST_TIMEOUT:-5}
      - HERITAGE_REQUEST_ATTEMPTS=${HERITAGE_REQUEST_ATTEMPTS:-4}
      - HERITAGE_LEXICON=${HERITAGE_LEXICON:-SH}
    ports:
      - "8000"
    volumes:
      - ../../src/l0/artifacts:/artifacts
      - ../../src/l0/data:/data:ro
      - ../../third_party/heritage/Heritage_Platform:/opt/Heritage_Platform:ro
