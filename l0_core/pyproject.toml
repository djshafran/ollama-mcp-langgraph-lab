[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprs-l0"
version = "0.1.0"
description = "L0 core: deterministic SPIR analysis utilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["sprs_l0*"]
