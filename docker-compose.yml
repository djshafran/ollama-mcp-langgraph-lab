services:
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build: ./mcp_server
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - ALLOWED_DIR=/workspace
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace

  l0:
    build:
      context: .
      dockerfile: src/l0/server/Dockerfile
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - L0_ARTIFACT_DIR=/artifacts/current
      - L0_DATA_DIR=/data
      - L0_BACKEND=${L0_BACKEND}
      - HERITAGE_METHOD=${HERITAGE_METHOD}
      - HERITAGE_BASE_DIR=${HERITAGE_BASE_DIR}
      - HERITAGE_REQUEST_TIMEOUT=${HERITAGE_REQUEST_TIMEOUT}
      - HERITAGE_REQUEST_ATTEMPTS=${HERITAGE_REQUEST_ATTEMPTS}
      - HERITAGE_LEXICON=${HERITAGE_LEXICON}
    ports:
      - "8001:8000"
    volumes:
      - ./src/l0/artifacts:/artifacts
      - ./src/l0/data:/data
      - ./third_party/heritage/Heritage_Platform:/opt/Heritage_Platform:ro

  agent:
    build: ./agent
    depends_on:
      - ollama
      - mcp
      - l0
    environment:
      - MODEL=${MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - MCP_URL=${MCP_URL}
      - L0_MCP_URL=${L0_MCP_URL}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
      - TEMPERATURE=${TEMPERATURE}
      - NUM_CTX=${NUM_CTX}
      - REASONING=${REASONING}
      - THINKING_TRACE=${THINKING_TRACE}
      - PLAN_BACKEND=${PLAN_BACKEND}
      - RECONCILE_BACKEND=${RECONCILE_BACKEND}
      - SHOW_REASONING=${SHOW_REASONING}
    volumes:
      - ./workspace:/workspace

volumes:
  ollama:
